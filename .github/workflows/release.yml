name: Release

# Publishing a GitHub release with a new tag vX.Y.Z builds that tag as version X.Y.Z and attaches the
# linux binaries. The version comes from the tag, so no version-bump commit is needed beforehand.

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild and re-attach artifacts for (e.g. v4.3.0)'
        required: true

permissions:
  contents: write

# A second run for the same tag (publish plus a manual re-run) waits instead of racing the upload.
concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    # Pre-releases, such as the rolling snapshot, are not versioned releases.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Validate tag
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: release tag '${TAG}' must look like vX.Y.Z (e.g. v4.3.0)." >&2
            echo "Delete this release and its tag, then publish a new release with a vX.Y.Z tag." >&2
            exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      # Fail before building when the release has no notes, so a release cannot go out without them.
      - name: Extract release notes
        run: ./.github/scripts/release-notes.sh "${VERSION}" > "${RUNNER_TEMP}/release-notes.md"

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Package
        run: ./.github/scripts/package.sh "${VERSION}" dist

      # Naming each archive by version also fails the upload if the build produced a different version.
      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${TAG}" --clobber \
            "dist/memory-calculator-${VERSION}-linux-amd64.tgz" \
            "dist/memory-calculator-${VERSION}-linux-arm64.tgz" \
            dist/SHA256SUMS

      # Copies the RELEASE_NOTES.md section of this tag into the release text, replacing what was typed when
      # publishing. A re-run keeps the text in sync with the file.
      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${TAG}" --notes-file "${RUNNER_TEMP}/release-notes.md"

  # After a release, proposes the next version heading in RELEASE_NOTES.md as a pull request. This needs the
  # repository setting "Allow GitHub Actions to create and approve pull requests". Without it the step only
  # logs a warning and the release is unaffected: add the heading by hand, see docs/RELEASE.md.
  next-notes:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Propose notes for the next version
        continue-on-error: true
        run: |
          VERSION="${TAG#v}"
          NEXT=$(./.github/scripts/next-notes.sh "${VERSION}")
          if [[ -z "${NEXT}" ]]; then
            echo "Nothing to add: the newest heading in RELEASE_NOTES.md is not v${VERSION}."
            exit 0
          fi

          BRANCH="next-release-notes-${NEXT}"
          if [[ -n "$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[].number')" ]]; then
            echo "A pull request for ${BRANCH} is already open."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${BRANCH}"
          git commit -am "docs: start release notes for v${NEXT}"
          if ! git push origin "${BRANCH}" || ! gh pr create \
              --base "${{ github.event.repository.default_branch }}" --head "${BRANCH}" \
              --title "docs: start release notes for v${NEXT}" \
              --body "Adds an empty \`## v${NEXT}\` section to RELEASE_NOTES.md after v${VERSION}. Write the notes before releasing, or change the heading if the next release is a larger jump. The Release workflow fails on an empty section."; then
            echo "::warning::Could not open the pull request. Add a '## v${NEXT}' section to RELEASE_NOTES.md by hand, see docs/RELEASE.md."
            exit 1
          fi
